name: CI

# The same three gates a reviewer can run locally, in the same order:
#   npm run typecheck  ·  npm test  ·  npm run build
# Nothing exotic — a green tick here means the app compiles, every trace
# generator passes its contract tests, and the production bundle builds.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (strict, no any)
        run: npm run typecheck

      - name: Unit tests (trace contract + invariants)
        run: npm test

      - name: Production build
        run: npm run build

      - name: Report bundle size
        if: always()
        run: |
          echo "### Bundle" >> $GITHUB_STEP_SUMMARY
          du -sh dist 2>/dev/null || true
          find dist/assets -name '*.js' -printf '%s %p\n' 2>/dev/null | sort -rn | head -5 || true
